[package]
name = "spotlite"
version = "0.1.0"
description = "Spotlite — a lightweight Spotify desktop client"
authors = ["Spotlite contributors"]
edition = "2021"
rust-version = "1.85"

# The library is what Tauri's mobile/desktop entrypoints call into.
[lib]
name = "spotlite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
keyring = { version = "3", features = ["windows-native", "sync-secret-service", "apple-native"] }
url = "2"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
thiserror = "2"
tiny_http = "0.12"
log = "0.4"

[features]
# Default production features.
default = []

[profile.release]
# Aggressive size optimization — protects the "lightweight" footprint claim.
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
